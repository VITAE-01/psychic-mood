form input:not([type="checkbox"]), form select{
height:40px;

.btn-primary{

a.text-primary {

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

input[type="number"] {
    -moz-appearance: textfield;
}

.checkin-progress-wrapper {
    width: 100%;
}

.progress-step {
    padding: 8px 16px;
    border-radius: 8px;
    background-color: #e9ecef;
    color: #6c757d;
    font-weight: 500;
    transition: background-color 0.3s ease, color 0.3s ease;
    white-space: nowrap;
}

.progress-step.active {
    background-color: #0d6efd;
    color: white;
}

.progress-line {
    flex-grow: 1;
    height: 3px;
    background-color: #e9ecef;
    transition: background-color 0.3s ease;
}

.progress-step.active + .progress-line {
    background-color: #0d6efd;
}

/* Fade-in animation for steps */
.step-content {
    animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.mood-img {
    width: 30px;
    height: 30px;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.mood-item {
    text-align: center;
    cursor: pointer;
}

.mood-item:hover .mood-img {
    transform: scale(1.10);
}

/* Selected state */
.mood-item.selected .mood-img {
    transform: scale(1.5);
    box-shadow: 0 0 12px rgba(13, 110, 253, 0.45);
}

.mood-label {
    font-size: 0.8rem;
    margin-top: 4px;
}

.research-footer {
    text-align: center;
    font-size: 0.8rem;
    color: #888;
    margin-top: 2rem;
    margin-bottom: 20px;
}

.day-box {
    transition: all 0.2s ease-in-out;
    cursor: pointer;
}

.day-box:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
}

.mood-card {
    background-color: #e1eff5;
    border-radius: 12px;
}

.weekly-bar-container {
    height: 180px;
}

.activity-bar-wrapper {
    height: 120px;
    width: 30px;
    background-color: #ffffff;
    border-radius: 20px;
    display: flex;
    position: relative;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
}

.activity-bar {
    width: 100%;
    border-radius: 20px;
    position: relative;
    display: flex;
    justify-content: center;
    transition: height 450ms cubic-bezier(.2,.9,.3,1);
    will-change: height;
    cursor: pointer;
}

.activity-bar:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
}

.mood-img-trend {
    width: 22px;
    height: 22px;
    position: absolute;
    top: -15px;
    background: white;
    border-radius: 50%;
    padding: 2px;
    cursor: pointer;
}

.mood-img-empty {
    width: 22px;
    height: 22px;
    position: absolute;
    bottom: 5px;
    background: white;
    border-radius: 50%;
    padding: 2px;
    cursor: pointer;
}

.mood-img-trend, .mood-img-empty {
    transition: transform 300ms ease, opacity 200ms ease;
}

.icon-xs {

.icon-bold {

<script>
function validatePhysicalActivity() {
    let performed = document.querySelector('[name="performed_activity"]').value;

    // Clear previous errors
    document.getElementById('error-performed_activity').innerText = "";

    // If user didn't choose Yes/No
    if (!performed) {
        document.getElementById('error-performed_activity').innerText = "Please select Yes or No.";
        return false;
    }

    // If NO → skip validation
    if (performed === "no") {
        return true;
    }

    // If YES → require at least one activity
    const fields = ["walking", "running", "cycling", "gym", "sport", "others"];
    let atLeastOne = false;

    // Check if at least one field has a value
    fields.forEach(f => {
        let value = document.querySelector(`[name="${f}"]`).value;
        if (value) {
            atLeastOne = true;
        }
    });

    if (!atLeastOne) {
        // Show a single combined error OR individual errors
        document.getElementById('error-performed_activity').innerText = "Please select duration of at least one activity.";
        return false;
    }

    return true;
}
</script>

<script>
function nextStep(step) {

    // Clear all errors
    const fields = [
        "perceived_benefits",
        "self_efficacy",
        "barrier_time",
        "barrier_tired",
        "barrier_others"
    ];

    // STEP 1 VALIDATION (skip if user already checked in today)
    if (step === 2) {
        if (HAS_CHECKED_IN_TODAY) {

        } else {
            let valid = true;

            fields.forEach(f => {
                let value = document.querySelector(`[name="${f}"]`)?.value;
                if (!value) {
                    document.getElementById("error-" + f).innerText = "Please select an option.";
                    valid = false;
                }
            });

            if (!valid) return;
        }
    }

    // STEP 2 VALIDATION
    if (step === 3) {
        if (!validatePhysicalActivity()) return;
    }

    // STEP 3 VALIDATION (before submit)
    if (step === 'submit') {
        let mood = document.getElementById('mood_value').value;

        if (!mood) {
            document.getElementById('error-mood').innerText = "Please select a mood emoji.";
            return;
        }

        // Disable the submit button to prevent double clicks
        const btn = document.getElementById("completeCheckinBtn");
        btn.disabled = true;
        btn.style.opacity = "0.6";
        btn.style.cursor = "not-allowed";
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Submitting...`;

        // Disable the Back button
        const backBtn = document.getElementById("isCompleteBackButton");
        if (backBtn) {
            backBtn.disabled = true;
            backBtn.style.opacity = "0.5";
            backBtn.style.cursor = "not-allowed";
        }

        const form = document.getElementById("checkinForm");

        fetch(form.action, {
            method: "POST",
            body: new FormData(form),
        })
        .then(response => response.json())
        .then(data => {

            if (data.status === "blocked") {
                // Show error inside modal
                document.getElementById("error-mood").innerText = data.message;

                // Re-enable buttons
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerText = "Complete Check‑In";

                backBtn.disabled = false;
                backBtn.style.opacity = "1";

                return;
            }

            if (data.status === "ok") {
                // Success → redirect normally
                window.location.href = "/dashboard/";
            }
        });

        return;
    }

    // Hide all steps
    document.querySelectorAll('.step-content').forEach(div => {
        div.style.display = 'none';
    });

    // Show selected step with fade animation
    let activeStep = document.getElementById('step' + step);
    activeStep.style.display = 'block';

    // Update progress bar
    document.getElementById('prog1').classList.remove('active');
    document.getElementById('prog2').classList.remove('active');
    document.getElementById('prog3').classList.remove('active');

    document.getElementById('prog' + step).classList.add('active');
}
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('dayDetailModal');

        modal.addEventListener('show.bs.modal', function (event) {
            var trigger = event.relatedTarget;

            // Extract data attributes
            var dayLabel = trigger.getAttribute('data-day-label'); 
            var dayDate = trigger.getAttribute('data-day-date');
            var mood = trigger.getAttribute('data-mood');
            var belief = trigger.getAttribute('data-hbm-summary');
            var activityBreakdown = trigger.getAttribute('data-activity-breakdown');
            var activityIntensity = trigger.getAttribute('data-activity-intensity');
            // Populate modal title
            document.getElementById('detailModalTitle').textContent =
                dayLabel + " — " + dayDate;

            // Mood icon
            var moodIcon = document.getElementById('detailMoodIcon');
            moodIcon.src = "/static/dashboard/images/" + mood + ".png";

            // Mood feedback
            document.getElementById('detailMoodScore').textContent =
                "Mood feedback — " + mood;

            // Belief feedback
            document.getElementById('detailBelief').textContent = belief;
            
            // Activity intensity
            document.getElementById('detailActivityIntensity').textContent =
                activityIntensity + "%";

            // Activity breakdown 
            function pythonDictToJson(pyDictString) {
                return pyDictString
                    .replace(/'/g, '"')
                    .replace(/None/g, '"None"')
                    .replace(/True/g, 'true') 
                    .replace(/False/g, 'false');
            }
            var raw = activityBreakdown;
            
            // Convert Python dict → JSON
            var jsonString = pythonDictToJson(raw);
            var breakdownData = JSON.parse(jsonString);
            var breakdownText = Object.entries(breakdownData)
            .map(([key, value]) => {
                return `
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-capitalize">${key}</span>
                        <span class="text-muted">${value}</span>
                    </div>
                `;
            })
            .join("");

            document.getElementById('detailActivityBreakdown').innerHTML = breakdownText;
        });
    });
</script>

<script>
    function escapeHtml(s) {
        return String(s === null || s === undefined ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderWeeklyUI(weekDays) {
        const container = document.querySelector(".weekly-bar-container");
        if (!container) {
            return;
        }

        const slots = Array.from(container.children).slice(0, 7);

        if (slots.length === 0) {
            return;
        }

        weekDays.forEach((day, i) => {
            const slot = slots[i];
            if (!slot) {
                return;
            }

            const mood = day.mood ? escapeHtml(day.mood) : "";
            const moodImgTag = mood
                ? `<img src="/static/dashboard/images/${mood}.png" class="${day.activity_intensity_report > 0 ? 'mood-img-trend' : 'mood-img-empty'}" 
                        data-bs-toggle="modal" data-bs-target="#dayDetailModal"
                        data-day-label="${escapeHtml(day.label)}"
                        data-day-date="${escapeHtml(day.date)} ${escapeHtml(day.month)}, ${escapeHtml(day.year)}"
                        data-mood="${escapeHtml(day.mood)}"
                        data-mood-score="${escapeHtml(day.mood_score)}"
                        data-hbm-summary="${escapeHtml(day.daily_hbm_summary)}"
                        data-activity-breakdown='${escapeHtml(JSON.stringify(day.activity_breakdown || {}))}'
                        data-activity-intensity="${escapeHtml(day.activity_intensity_report)}"
                    />`
                : "";

            let colorClass = "";
            if (day.mood === "fulfilled" || day.mood === "energized") colorClass = "bg-success";
            else if (day.mood === "okay") colorClass = "bg-warning";
            else if (day.mood === "low" || day.mood === "stressed") colorClass = "bg-danger";

            let activityBarHtml = "";
            const targetHeight = Number(day.activity_intensity_report) || 0;
            if (targetHeight > 0) {
                activityBarHtml = `
                    <div class="activity-bar d-flex justify-content-center align-items-start ${colorClass}"
                        style="height: 0%;" 
                        data-target-height="${targetHeight}"
                        data-bs-toggle="modal"
                        data-bs-target="#dayDetailModal"
                        data-day-label="${escapeHtml(day.label)}"
                        data-day-date="${escapeHtml(day.date)} ${escapeHtml(day.month)}, ${escapeHtml(day.year)}"
                        data-mood="${escapeHtml(day.mood)}"
                        data-mood-score="${escapeHtml(day.mood_score)}"
                        data-hbm-summary="${escapeHtml(day.daily_hbm_summary)}"
                        data-activity-breakdown='${escapeHtml(JSON.stringify(day.activity_breakdown || {}))}'
                        data-activity-intensity="${escapeHtml(day.activity_intensity_report)}"
                    >
                        ${moodImgTag}
                    </div>
                `;
            } else {
                activityBarHtml = `
                    <div class="activity-bar d-flex justify-content-center align-items-start" style="height: 0%;">
                        <!-- empty track -->
                    </div>
                    ${moodImgTag}
                `;
            }

            const labelClass = day.is_today ? "text-center mt-1 small fw-bold text-primary" : "text-center mt-1 small fw-bold text-muted";
            const labelHtml = `<div class="${labelClass}">${escapeHtml(day.label)}</div>`;

            // Compose final slot inner HTML (keeps the same outer wrapper classes)
            const slotInner = `
                <div class="activity-bar-wrapper d-flex align-items-end">
                    ${activityBarHtml}
                </div>
                ${labelHtml}
            `;

            slot.innerHTML = slotInner;

            const insertedBar = slot.querySelector(".activity-bar[data-target-height]");
            if (insertedBar) {
                requestAnimationFrame(() => {
                    // small delay to be extra-safe across browsers
                    setTimeout(() => {
                        const target = insertedBar.getAttribute("data-target-height");
                        insertedBar.style.height = `${target}%`;
                    }, 10);
                });
            }
        });
    }
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const nav = document.getElementById("weekNav");
        const firstCheckinStr = nav.dataset.firstCheckin;
        const todayStr = nav.dataset.today;

        function parseLocalDate(iso) {
            if (!iso) return null;
            const [y, m, d] = iso.split("-").map(Number);
            return new Date(y, m - 1, d);
        }

        const today = parseLocalDate(todayStr);
        const firstCheckin = parseLocalDate(firstCheckinStr);

        function getSundayStart(date) {
            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const day = d.getDay();
            if (day === 0) {
                return new Date(d);
            }
            const diff = day;
            const sunday = new Date(d);
            sunday.setDate(d.getDate() - diff);
            return sunday;
        }

        // Initial week start
        let currentWeekStart = getSundayStart(today);

        function updateWeekLabel() {
            const weekEnd = new Date(currentWeekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);

            const options = { month: "short", day: "numeric" };
            const label = `${currentWeekStart.toLocaleDateString("en-GB", options)} – ${weekEnd.toLocaleDateString("en-GB", options)}`;

            document.getElementById("weekLabel").textContent = label;
        }

        function updateButtons() {
            const nextWeekStart = new Date(currentWeekStart);
            nextWeekStart.setDate(nextWeekStart.getDate() + 7);

            const prevWeekStart = new Date(currentWeekStart);
            prevWeekStart.setDate(prevWeekStart.getDate() - 7);

            const prevWeekEnd = new Date(prevWeekStart);
            prevWeekEnd.setDate(prevWeekStart.getDate() + 6);

            const nextDisabled = nextWeekStart > today;
            const prevDisabled = prevWeekEnd < firstCheckin;

            document.getElementById("nextWeek").disabled = nextDisabled;
            document.getElementById("prevWeek").disabled = prevDisabled;
        }

        function loadWeekData() {
            const isoDate = currentWeekStart.getFullYear() + "-" +
                    String(currentWeekStart.getMonth() + 1).padStart(2, "0") + "-" +
                    String(currentWeekStart.getDate()).padStart(2, "0");

                fetch(`/dashboard/week-data/?start=${isoDate}`)
                    .then(response => response.json())
                    .then(data => {
                        renderWeeklyUI(data.week_days)
                    })
                    .catch(err => {
                        console.error("DEBUG → Fetch error:", err);
                    });
        }

        updateWeekLabel();
        updateButtons();

        // Handle Prev Week
        document.getElementById("prevWeek").addEventListener("click", function () {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            updateWeekLabel();
            updateButtons();
            loadWeekData();
        });

        // Handle Next Week
        document.getElementById("nextWeek").addEventListener("click", function () {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            updateWeekLabel();
            updateButtons();
            loadWeekData();
        });

    });
</script>

</html>
